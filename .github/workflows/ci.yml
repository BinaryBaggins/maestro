name: CI

on:
  push:
    branches:
      - feat/**

jobs:
  test:
    name: Test (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Oracle JDK 25.0.4
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25.0.4'
          cache: maven

      - name: Run Maven tests
        run: mvn -B test